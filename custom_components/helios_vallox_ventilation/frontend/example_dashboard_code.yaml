title: Ventilation
path: vent-2026-06-2
separator_line: "-------------------------------------------------------------------"
type: sections
header: {}
badges: []
cards: []
max_columns: 4
dense_section_placement: true
layout:
  grid-template-columns: 1fr 1fr
  grid-template-rows: auto
  grid-gap: 16px
background:
  opacity: 100
  alignment: center
  size: cover
  repeat: no-repeat
  attachment: fixed
  image:
    media_content_id: /local/community/helios_vallox_ventilation/page_background.png
    media_content_type: image/png
sections:
  - type: grid
    cards:
      - type: heading
        icon: " "
        heading_style: title
        style: |
          ha-card {
            height: 240px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
          }
      - type: picture-elements
        name: Remote_Control
        show_state: false
        show_name: false
        panel: true
        image: /local/community/helios_vallox_ventilation/rc_background.png
        card_mod:
          style: |
            ha-card { 
              background: transparent;
              --ha-card-border-color: rgba(0,0,0,0);
              --ha-card-border-radius: 0px;
              --ha-card-border-width: 0px;
            }
        elements:
          - type: custom:button-card
            name: __init_i18n__
            show_name: false
            show_icon: false
            tap_action:
              action: null
            styles:
              card:
                - display: none
            custom_fields:
              init: |
                [[[
                  const KEY = "helios.i18n.display";
                  const detectLang = () => {
                    const l = (
                      typeof hass !== "undefined" && hass?.language
                        ? hass.language
                        : navigator?.language || "en"
                    ).toLowerCase().split("-")[0];
                    if (l === "nb" || l === "nn") return "no";
                    return ["de", "en", "fr", "es", "nl", "da", "sv", "no", "fi"].includes(l)
                      ? l
                      : "en";
                  };
                  const defaults = {
                    de: {
                      temp_titles: ["Außenluft", "Zuluft", "Abluft", "Fortluft"],
                      page2_title: "Stufe (lange drücken)",
                      page3_title: "Alternative Stoßlüftung",
                      label_fanspeed: "Lüfterstufe",
                      label_minutes: "Minuten",
                      label_fireplace: "Kaminmodus",
                      boost_active: "Aktiv",
                      boost_back_to_speed_prefix: 'Zurück zu Lüfterstufe ',
                      boost_back_to_speed_suffix: ' in',
                      label_selected_device: "Ausgewählte Lüftungsanlage",
                      label_start: "Start",
                      label_cancel: "Abbrechen"
                    },
                    en: {
                      temp_titles: ["Outdoor air", "Supply air", "Extract air", "Exhaust air"],
                      page2_title: "Fanspeed (hold to set)",
                      page3_title: "Alternative timed boost",
                      label_fanspeed: "Fan speed",
                      label_minutes: "Minutes",
                      label_fireplace: "Fireplace mode",
                      boost_active: "Active",
                      boost_back_to_speed_prefix: 'Back to fan speed ',
                      boost_back_to_speed_suffix: ' in',
                      label_selected_device: "Selected ventilation unit",
                      label_start: "Start",
                      label_cancel: "Cancel"
                    },
                    fr: {
                      temp_titles: ["Air extérieur", "Air soufflé", "Air extrait", "Air rejeté"],
                      page2_title: "Niveau (appui long)",
                      page3_title: "Boost alternatif",
                      label_fanspeed: "Vitesse du ventilateur",
                      label_minutes: "Minutes",
                      label_fireplace: "Mode cheminée",
                      boost_active: "Actif",
                      boost_back_to_speed_prefix: 'Retour à la vitesse ',
                      boost_back_to_speed_suffix: ' dans',
                      label_selected_device: "Unité sélectionnée",
                      label_start: "Démarrer",
                      label_cancel: "Annuler"
                    },
                    es: {
                      temp_titles: ["Aire exterior", "Impulsión", "Extracción", "Expulsión"],
                      page2_title: "Nivel (mantener)",
                      page3_title: "Boost alternativo",
                      label_fanspeed: "Velocidad del ventilador",
                      label_minutes: "Minutos",
                      label_fireplace: "Modo chimenea",
                      boost_active: "Activo",
                      boost_back_to_speed_prefix: 'Volver a velocidad ',
                      boost_back_to_speed_suffix: ' en',
                      label_selected_device: "Unidad seleccionada",
                      label_start: "Iniciar",
                      label_cancel: "Cancelar"
                    },
                    nl: {
                      temp_titles: ["Buitenlucht", "Toevoer", "Afvoer", "Uitblaas"],
                      page2_title: "Stand (lang drukken)",
                      page3_title: "Alternatieve boost",
                      label_fanspeed: "Ventilatiestand",
                      label_minutes: "Minuten",
                      label_fireplace: "Haardmodus",
                      boost_active: "Actief",
                      boost_back_to_speed_prefix: 'Terug naar stand ',
                      boost_back_to_speed_suffix: ' over',
                      label_selected_device: "Geselecteerde unit",
                      label_start: "Start",
                      label_cancel: "Annuleren"
                    },
                    da: {
                      temp_titles: ["Udeluft", "Tilluft", "Fraluft", "Afluft"],
                      page2_title: "Trin (hold nede)",
                      page3_title: "Alternativ boost",
                      label_fanspeed: "Ventilationsniveau",
                      label_minutes: "Minutter",
                      label_fireplace: "Pejsetilstand",
                      boost_active: "Aktiv",
                      boost_back_to_speed_prefix: 'Tilbage til ventilationsniveau ',
                      boost_back_to_speed_suffix: ' om',
                      label_selected_device: "Valgt ventilationsenhed",
                      label_start: "Start",
                      label_cancel: "Annuller"
                    },
                    sv: {
                      temp_titles: ["Uteluft", "Tilluft", "Frånluft", "Avluft"],
                      page2_title: "Nivå (håll in)",
                      page3_title: "Alternativ forcering",
                      label_fanspeed: "Fläkthastighet",
                      label_minutes: "Minuter",
                      label_fireplace: "Eldstadsläge",
                      boost_active: "Aktiv",
                      boost_back_to_speed_prefix: 'Tillbaka till fläkthastighet ',
                      boost_back_to_speed_suffix: ' om',
                      label_selected_device: "Vald ventilationsenhet",
                      label_start: "Starta",
                      label_cancel: "Avbryt"
                    },
                    no: {
                      temp_titles: ["Uteluft", "Tilluft", "Avtrekksluft", "Avkastluft"],
                      page2_title: "Trinn (hold inne)",
                      page3_title: "Alternativ boost",
                      label_fanspeed: "Ventilasjonsnivå",
                      label_minutes: "Minutter",
                      label_fireplace: "Peismodus",
                      boost_active: "Aktiv",
                      boost_back_to_speed_prefix: 'Tilbake til ventilasjonsnivå ',
                      boost_back_to_speed_suffix: ' om',
                      label_selected_device: "Valgt ventilasjonsenhet",
                      label_start: "Start",
                      label_cancel: "Avbryt"
                    },
                    fi: {
                      temp_titles: ["Ulkoilma", "Tuloilma", "Poistoilma", "Jäteilma"],
                      page2_title: "Taso (pidä painettuna)",
                      page3_title: "Vaihtoehtoinen tehostus",
                      label_fanspeed: "Ilmanvaihtotaso",
                      label_minutes: "Minuuttia",
                      label_fireplace: "Takkatila",
                      boost_active: "Aktiivinen",
                      boost_back_to_speed_prefix: 'Takaisin ilmanvaihtotasolle ',
                      boost_back_to_speed_suffix: ' kuluttua',
                      label_selected_device: "Valittu ilmanvaihtolaite",
                      label_start: "Käynnistä",
                      label_cancel: "Peruuta"
                    }
                  };
                  const data = {
                    lang: detectLang(),
                    strings: defaults
                  };
                  localStorage.setItem(KEY, JSON.stringify(data));
                  return "";
                ]]]
          - type: conditional
            conditions:
              - entity: number.helios_vallox_ui_display_select
                state: "1"
            elements:
              - type: image
                image: /local/community/helios_vallox_ventilation/rc_buttontexts.png
                card_mod: null
                tap_action:
                  action: null
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  transform: translate(-50%, -50%)
              - name: On Off Button
                type: custom:button-card
                template: ventilation_remote_control_leds
                entity: |
                  [[[
                    const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                    return `switch.${slug}_powerstate`;
                  ]]]
                tap_action:
                  action: more-info
                style:
                  top: 45%
                  left: 18%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: CO2 Button
                type: custom:button-card
                template: ventilation_remote_control_leds
                entity: |
                  [[[
                    const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                    return `switch.${slug}_co2_indicator`;
                  ]]]
                tap_action:
                  action: more-info
                style:
                  top: 45%
                  left: 38%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: RH Button
                type: custom:button-card
                template: ventilation_remote_control_leds
                entity: |
                  [[[
                    const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                    return `switch.${slug}_rh_indicator`;
                  ]]]
                tap_action:
                  action: more-info
                style:
                  top: 45%
                  left: 58%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: C Button
                type: custom:button-card
                template: ventilation_remote_control_leds
                entity: |
                  [[[
                    const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                    return `select.${slug}_winter_mode`;
                  ]]]
                tap_action:
                  action: call-service
                  service: select.select_next
                  data:
                    entity_id: |
                      [[[
                        const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                        return `select.${slug}_winter_mode`;
                      ]]]
                    cycle: true
                style:
                  top: 45%
                  left: 78%
                  width: 5%
                  transform: translate(-50%, -50%)
              - title: Display
                type: custom:button-card
                name: |
                  [[[
                    const displayIndexEntity = states['number.helios_vallox_ui_display_index'];
                    let index = parseInt(displayIndexEntity?.state ?? '0', 10);
                    if (isNaN(index)) index = 0;
                    index = Math.max(0, Math.min(3, index));

                    const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                    const KEY = "helios.i18n.display";
                    // Sprache bestimmen: localStorage.lang -> hass.language -> navigator.language -> de
                    const getLang = () => {
                      try {
                        const d = JSON.parse(localStorage.getItem(KEY));
                        return d?.lang || "de";
                      } catch (e) { return "de"; }
                    };
                    // Titles laden, mit Fallback auf Deutsch
                    const getTitles = (lang) => {
                      try {
                        const d = JSON.parse(localStorage.getItem(KEY));
                        const cur = d?.strings?.[lang];
                        const de  = d?.strings?.de;
                        if (cur && !Array.isArray(cur) && Array.isArray(cur.temp_titles)) return cur.temp_titles;
                        if (Array.isArray(cur)) return cur;
                        if (de && !Array.isArray(de) && Array.isArray(de.temp_titles)) return de.temp_titles;
                        if (Array.isArray(de)) return de;
                        return ["Außenluft","Zuluft","Abluft","Fortluft"];
                      } catch (e) { return ["Außenluft","Zuluft","Abluft","Fortluft"]; }
                    };
                    const lang = getLang();
                    const titles = getTitles(lang);
                    const entities = [
                      `sensor.${slug}_temperature_outdoor_air`,
                      `sensor.${slug}_temperature_supply_air`,
                      `sensor.${slug}_temperature_extract_air`,
                      `sensor.${slug}_temperature_exhaust_air`
                    ];
                    const entityId = entities[index];
                    const rawValue = entityId ? states[entityId]?.state : undefined;

                    const zeile1 = titles[index] ?? '';
                    const zeile2 = rawValue && !['unknown', 'unavailable'].includes(rawValue) ? rawValue : '-';

                    return `<div class="lcd">
                              <div class="l1">${zeile1}</div>
                              <div class="l2">${zeile2} °C</div>
                            </div>`;
                  ]]]
                style:
                  left: 57%
                  top: 78%
                styles:
                  card:
                    - padding: 0
                    - margin: 0
                    - color: black
                    - background-color: "#5CCA03"
                    - border: 2px inset lightgrey
                    - display: |
                        [[[
                          const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                          return (states[`switch.${slug}_powerstate`]?.state !== 'on') ? 'none' : 'block';
                        ]]]
                  name:
                    - padding: 0
                    - margin: 0
                card_mod:
                  style: >
                    :host, ha-card { 
                      width: 83% !important;
                      height: 35% !important;
                    } ha-card { box-sizing: border-box; } #name, #name * {
                    box-sizing: border-box; } #name .lcd{
                      width: 100%;
                      justify-content: center;
                      white-space: nowrap;
                      overflow: hidden;
                      text-overflow: ellipsis;
                      line-height: 1.05;
                    } #name .l1{
                      font-size: clamp(16px, 1.6vw, 20px);
                      font-weight: 700;
                    } #name .l2{
                      font-size: clamp(16px, 1.6vw, 20px);
                      font-weight: 400;
                    }
              - name: Display Up Button
                type: custom:button-card
                template: ventilation_remote_control_buttons
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.helios_vallox_ui_display_index
                  data:
                    value: |
                      [[[
                        let index = parseInt(states['number.helios_vallox_ui_display_index'].state);
                        let max_index = 3;
                        let newlevel = 0;
                        if (index < max_index) { newlevel = index + 1 };
                        return newlevel;
                      ]]]
                style:
                  top: 87%
                  left: 18%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: Display Down Button
                type: custom:button-card
                template: ventilation_remote_control_buttons
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.helios_vallox_ui_display_index
                  data:
                    value: |
                      [[[
                        let index = parseInt(states['number.helios_vallox_ui_display_index'].state);
                        let min_index = 0;
                        let newlevel = 3;
                        if (index > min_index) { newlevel = index - 1 };
                        return newlevel;
                      ]]]
                style:
                  top: 87%
                  left: 38%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: Plus Button
                type: custom:button-card
                template: ventilation_remote_control_buttons
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: |
                      [[[
                        const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                        return `number.${slug}_fanspeed`;
                      ]]]
                  data:
                    value: |
                      [[[
                        const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                        let current_speed = parseInt(states[`number.${slug}_fanspeed`]?.state ?? 0);
                        if (current_speed < 8) {
                          return current_speed + 1
                        } else {
                          return current_speed
                        }
                      ]]]
                style:
                  top: 87%
                  left: 58%
                  width: 5%
                  transform: translate(-50%, -50%)
              - name: Minus Button
                type: custom:button-card
                template: ventilation_remote_control_buttons
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: |
                      [[[
                        const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                        return `number.${slug}_fanspeed`;
                      ]]]
                  data:
                    value: |
                      [[[
                        const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                        let current_speed = parseInt(states[`number.${slug}_fanspeed`]?.state ?? 0);
                        if (current_speed > 1) {
                          return current_speed - 1
                        } else {
                          return current_speed
                        }
                      ]]]
                style:
                  top: 87%
                  left: 78%
                  width: 5%
                  transform: translate(-50%, -50%)
          - name: Fan speed buttons
            type: conditional
            conditions:
              - entity: number.helios_vallox_ui_display_select
                state: "2"
            elements:
              - type: custom:button-card
                title: Set fan speed header
                name: |
                  [[[
                    const KEY="helios.i18n.display";
                    try {
                      const d = JSON.parse(localStorage.getItem(KEY));
                      const lang = d?.lang || "de";
                      const s = d?.strings?.[lang] || d?.strings?.de || {};
                      return s.page2_title || "Set fan speed";
                    } catch (e) { return "Set fan speed"; }
                  ]]]
                tap_action:
                  action: none
                style:
                  left: 50%
                  top: 45%
                  width: 68%
                  transform: translate(-50%, -50%)
                card_mod:
                  style: |
                    ha-card { height: 2em !important; }
                styles:
                  card:
                    - background-color: rgba(92, 202, 3, 0.5)
                    - border: 2px inset
                    - border-radius: 5px
                    - box-shadow: 0 1px 2px rgba(0,0,0,0.15)
                    - padding: 0
                    - margin: 0
                  name:
                    - color: black
                    - font-size: clamp(16px, 1.4vw, 18px)
                    - font-weight: 600
                    - text-align: center
              - type: custom:button-card
                title: Fan Speed Buttons
                style:
                  top: 50%
                  left: 50%
                  width: 93%
                  transform: translate(-50%, 20%)
                card_mod:
                  style: |
                    ha-card { 
                      background: transparent;
                      width: 78% !important;
                      margin-left: 12%;
                    }
                styles:
                  card:
                    - padding: 1%
                  grid:
                    - grid-template-areas: |
                        'speed_header'
                        'speed_buttons'
                    - gap: .5em
                  custom_fields:
                    speed_buttons:
                      - align-self: center
                      - background-color: transparent
                      - border: none
                custom_fields:
                  speed_buttons:
                    card:
                      type: grid
                      columns: 4
                      cards:
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 1
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 2
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 3
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 4
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 5
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 6
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 7
                        - type: custom:button-card
                          template: ventilation_fan_speed_buttons
                          variables:
                            value: 8
          - name: Timed boost
            type: conditional
            conditions:
              - entity: number.helios_vallox_ui_display_select
                state: "3"
            elements:
              - type: custom:button-card
                title: Timed boost header
                name: |
                  [[[
                    const KEY="helios.i18n.display";
                    try {
                      const d = JSON.parse(localStorage.getItem(KEY));
                      const lang = d?.lang || "de";
                      const s = d?.strings?.[lang] || d?.strings?.de || {};
                      return s.page3_title || "Boost / Reduced Air Timer";
                    } catch (e) { return "Boost / Reduced Air Timer"; }
                  ]]]
                tap_action:
                  action: none
                style:
                  left: 50%
                  top: 45%
                  width: 68%
                  transform: translate(-50%, -50%)
                card_mod:
                  style: |
                    ha-card { height: 2em !important; }
                styles:
                  card:
                    - background-color: rgba(92, 202, 3, 0.5)
                    - border: 2px inset
                    - border-radius: 5px
                    - box-shadow: 0 1px 2px rgba(0,0,0,0.15)
                    - padding: 0
                    - margin: 0
                  name:
                    - color: black
                    - font-size: clamp(16px, 1.4vw, 18px)
                    - font-weight: 600
                    - text-align: center
              - type: custom:button-card
                style:
                  top: 58%
                  left: 50%
                  width: 88%
                  transform: translate(-50%, -10%)
                card_mod:
                  style: |
                    ha-card { 
                      background: transparent;
                      width: 80% !important;
                      margin-left: 10%
                    }
                styles:
                  card:
                    - padding: 1%
                  grid:
                    - grid-template-areas: |
                        'boost_settings boost_settings'
                        'fireplace start_stop'
                    - gap: .5em
                  custom_fields:
                    boost_settings:
                      - background-color: transparent
                      - margin-bottom: 10px
                    fireplace:
                      - justify-self: start
                      - align-self: center
                    start_stop:
                      - justify-self: end
                      - align-self: center
                      - margin-right: 10px
                      - background-color: transparent
                custom_fields:
                  boost_settings:
                    card:
                      type: custom:button-card
                      show_icon: false
                      show_state: false
                      show_name: true
                      name: |
                        [[[
                          const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                          const active = states[`binary_sensor.${slug}_softboost_active`]?.state === 'on';

                          const KEY="helios.i18n.display";
                          let s = {};
                          try {
                            const d = JSON.parse(localStorage.getItem(KEY));
                            const lang = d?.lang || "de";
                            s = d?.strings?.[lang] || d?.strings?.de || {};
                          } catch (e) {}

                          if (active) {
                            const remaining = states[`sensor.${slug}_softboost_remaining`];
                            const orig = remaining?.attributes?.original_fanspeed ?? '–';
                            const level = remaining?.attributes?.level
                              ?? states[`number.${slug}_softboost_level`]?.state
                              ?? '–';

                            return '<h1 style="margin-top: -0.2em; margin-bottom: 0.25em;">' +
                                    (s.boost_active || "Active") +
                                    ' (' + level + ')' +
                                   '</h1>' +
                                   '<div style="color: black; margin-top: -0.5em;">' +
                                    (s.boost_back_to_speed_prefix || 'Back to fan speed ') +
                                    orig +
                                    (s.boost_back_to_speed_suffix || ' in') +
                                   '</div>';
                          }

                          return ' ';
                        ]]]
                      styles:
                        grid:
                          - grid-template-areas: |
                              "fanspeed"
                              "duration"
                              "timer"
                          - height: |
                              [[[
                                const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                                return states[`binary_sensor.${slug}_softboost_active`]?.state === 'on'
                                  ? '10em'
                                  : '7em';
                              ]]]
                        card:
                          - background: none
                          - border-radius: 12px
                          - box-shadow: |
                              [[[
                                const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                                return states[`binary_sensor.${slug}_softboost_active`]?.state === 'on'
                                  ? 'inset 0px 0px 10px 2px #5CCA03'
                                  : 'none';
                              ]]]
                          - color: black
                          - border: 1px lightgrey solid
                          - margin-top: 10px
                          - padding: |
                              [[[
                                const slug = states['select.helios_vallox_ui_device_select']?.attributes?.selected_slug || 'ventilation';
                                return states[`binary_sensor.${slug}_softboost_active`]?.state === 'on'
                                  ? '0'
                                  : '14px 10px 5px 10px';
                              ]]]
                        name:
                          - color: "#5CCA03"
                          - position: absolute
                          - top: 2em
                          - left: 0
