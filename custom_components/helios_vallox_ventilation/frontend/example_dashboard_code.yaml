                  es: ["Temperaturas °C", "Eficiencia %", "Nivel de ventilación", "Aire exterior", "Aire de extracción", "Aire de impulsión", "Aire expulsado", "Eficiencia"],
                  nl: ["Temperaturen °C", "Efficiëntie %", "Ventilatiestand", "Buitenlucht", "Afvoerlucht", "Toevoerlucht", "Uitblaaslucht", "Efficiëntie"],
                  da: ["Temperaturer °C", "Effektivitet %", "Ventilationstrin", "Udeluft", "Udsugningsluft", "Indblæsningsluft", "Afkastluft", "Effektivitet"],
                  sv: ["Temperaturer °C", "Effektivitet %", "Ventilationsnivå", "Uteluft", "Frånluft", "Tilluft", "Avluft", "Effektivitet"],
                  no: ["Temperaturer °C", "Effektivitet %", "Ventilasjonstrinn", "Uteluft", "Avtrekksluft", "Tilluft", "Avkastluft", "Effektivitet"],
                  fi: ["Lämpötilat °C", "Hyötysuhde %", "Ilmanvaihtotaso", "Ulkoilma", "Poistoilma", "Tuloilma", "Jäteilma", "Hyötysuhde"]
                };

                const l = (hass.language || "en").toLowerCase();
                const b = l.split("-")[0];
                vars.t = tr[l] || tr[b] || (b === "nb" ? tr.no : null) || tr.en;

                const slug = meta?.selected_slug || "ventilation";
                vars.slug = slug;
                vars.prefix = `${slug}_`;

                return {};
              }
